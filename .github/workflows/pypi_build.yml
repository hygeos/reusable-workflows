# Reusable workflow: build a Python package and verify it is ready to publish.
#
# Meant to be called from a project's own workflow on a version tag push
# (e.g. v1.0.3). It checks that the tagged commit is on the main (or master)
# branch and that the tag matches the version in pyproject.toml, then builds
# the sdist + wheel and uploads them as the "python-package-distributions"
# artifact for the caller's publish job to download.
#
# The publish job itself must stay in the calling repository: PyPI Trusted
# Publishing does not accept a publish job running inside a reusable workflow
# from another repository (https://github.com/pypi/warehouse/issues/11096).
# See the README for the caller template and per-project prerequisites.
#
# Assumes the project name and version are declared statically under [project]
# in pyproject.toml (the PyPI project name may differ from the repository name).

name: Build PyPI package

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to build the package
        type: string
        required: false
        default: "3.12"
    outputs:
      package-name:
        description: Project name read from pyproject.toml
        value: ${{ jobs.build.outputs.package-name }}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    outputs:
      package-name: ${{ steps.metadata.outputs.name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + all branches, needed for the ancestry check

      # A tag push event does not know which branch the commit came from, so
      # check that the tagged commit is an ancestor of main (or master).
      # GITHUB_SHA is peeled with ^{commit} because for annotated tags it
      # points to the tag object, not the commit.
      - name: Verify tag is on main or master
        run: |
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if git merge-base --is-ancestor "$commit" origin/main 2>/dev/null || \
             git merge-base --is-ancestor "$commit" origin/master 2>/dev/null; then
            echo "Tag $GITHUB_REF_NAME is on the default branch. Proceeding."
          else
            echo "::error::Tag $GITHUB_REF_NAME is not on main/master. Aborting."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verify tag matches the package version
        id: metadata
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_name=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "name=$pkg_name" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match pyproject.toml version ($pkg_version)."
            exit 1
          fi

      - name: Build package (sdist + wheel)
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1
